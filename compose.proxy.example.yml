services:
  navidrome-catalog-proxy:
    build: .
    container_name: navidrome-catalog-proxy
    restart: unless-stopped

    environment:
      PORT: "4540"
      HOST: "0.0.0.0"
      LOG_LEVEL: "info"

      NAVIDROME_URL: "http://navidrome:4533"

      MUSIC_DIR: "/music"
      DOWNLOAD_DIR: "/app/downloads"
      CACHE_DIR: "/app/cache"
      DATA_DIR: "/app/data"

      YTDLP_PATH: "yt-dlp"
      FFMPEG_PATH: "ffmpeg"
      FFPROBE_PATH: "ffprobe"

      AUDIO_FORMAT: "opus"
      OPUS_BITRATE: "128k"
      PREFER_ORIGINAL_OPUS: "true"

      YOUTUBE_MAX_RESULTS: "10"
      DOWNLOAD_CONCURRENCY: "1"

      CLEANUP_ENABLED: "false"
      CLEANUP_DRY_RUN: "true"
      CLEANUP_QUARANTINE_DIR: "/music/.trash-candidates"
      CLEANUP_MAX_PLAY_COUNT: "1"
      CLEANUP_NOT_PLAYED_DAYS: "30"
      CLEANUP_MIN_LIBRARY_AGE_DAYS: "45"
      CLEANUP_QUARANTINE_DAYS: "30"

    volumes:
      - /opt/navidrome/music:/music:rw
      - ./data:/app/data
      - ./cache:/app/cache
      - ./downloads:/app/downloads

    networks:
      - atiende_network

    mem_limit: 768m
    cpus: 1.0

    security_opt:
      - no-new-privileges:true

networks:
  atiende_network:
    external: true
    name: atiende-plus_default
